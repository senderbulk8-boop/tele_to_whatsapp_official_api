name: Telegram to WhatsApp Bridge

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: wa-forward
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forward-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Telegram → WhatsApp Forwarder
        id: forward
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
        run: python bot.py

      - name: Commit and Push Updated bot.py (Auto Offset Save)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet bot.py; then
            echo "No changes in bot.py"
          else
            git add bot.py
            git commit -m "🤖 Auto-update LAST_OFFSET [skip ci]"
            git push
            echo "✅ bot.py updated with new offset"
          fi

      - name: Fail job if forwarding failed
        if: steps.forward.outcome == 'failure'
        run: exit 1
